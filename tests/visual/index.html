<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {

        --text-normal: #252722;
        --text-muted: #686b62;
        --text-faint: #989b91;

      body { margin: 0; min-height: 100vh; background: var(--background-primary); font-family: var(--font-interface-theme); }
      #app { min-height: 100vh; }
